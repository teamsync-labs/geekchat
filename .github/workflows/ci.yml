name: CI

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-image:
    name: Frontend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build frontend image
        run: docker build -t geekchat-frontend:ci ./frontend

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t geekchat-backend:ci ./backend

  backend-import:
    name: Backend import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Import app
        env:
          DATABASE_URL: postgresql+asyncpg://geekchat:geekchat@localhost:5432/geekchat
          BASE_URL: http://127.0.0.1:8000
        run: python -c "from main import app; print(app.title)"
